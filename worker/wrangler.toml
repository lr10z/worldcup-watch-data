name = "garmin-watchface-wc-game-status"
main = "src/index.js"
compatibility_date = "2026-05-26"

# Cron fires every minute. The Worker's scheduled handler decides whether to
# actually call api-football, based on a baked-in kickoff schedule — outside live
# windows it returns immediately, so the API quota only burns during matches.
#
# 1-min cadence on api-football Pro tier (7,500 calls/day, $19/mo, purchased
# 2026-06-10 for the World Cup window). Peak 4-match day = ~480 calls vs the
# 7,500 cap → ~6% utilisation, comfortable margin. Watch-displayed match minute
# is up to ~1 min stale at this Worker cadence, plus up to 5 min for the watch
# face's own background fetch (Garmin platform minimum), so ~6 min worst-case
# end-to-end. Old free-tier comment is preserved below for the post-tournament
# downgrade path.
#
# When the Pro subscription expires, revert to "*/10 * * * *" (or buy another
# month). On free tier, 10-min keeps us under the 100/day cap on peak days.
[triggers]
crons = ["* * * * *"]

# KV holds the latest status.json payload under a single key. Created once via:
#   wrangler kv namespace create garmin_wc_game_status_kv
# Then paste the printed id here.
[[kv_namespaces]]
binding = "GARMIN_WC_GAME_STATUS_KV"
id = "3fe5c48bcaf543d180f48719cfdbb69e"

# api-football league ID for the senior men's World Cup. The 2026 edition is the
# `year: 2026` season under this league. Verified via the /leagues?search=world%20cup
# lookup on 2026-05-27 — id=1, country="World".
[vars]
WC_LEAGUE_ID = "1"

# The api-football API key is stored as a secret (not in this file) via:
#   wrangler secret put API_FOOTBALL_KEY

# Workers Logs persistence: when the Worker fires (during live match windows),
# Cloudflare retains the invocation logs in the dashboard so we can audit the
# api-football fetch cycle after the fact. Toggled on via the dashboard
# (Settings → Observability → Logs) on 2026-06-10; this block mirrors that
# change so a future `wrangler deploy` doesn't strip it. Retention window is
# whatever Cloudflare's current free-tier policy is — check their docs if you
# need an exact number.
[observability.logs]
enabled = true
invocation_logs = true

# Empty table = traces config exists with defaults (still disabled). Required
# so wrangler doesn't treat the absence as a directive to remove traces config.
[observability.traces]